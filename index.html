<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f0e8" />

    <title>DiskAtlas</title>

  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 36rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif">

        <p lang="de">DiskAtlas vermisst Ordner direkt in deinem Browser und braucht dafür JavaScript. Bitte aktiviere es und lade die Seite neu.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
