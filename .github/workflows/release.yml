name: Release helper

# Pushing a tag such as v0.1.0 builds DiskAtlas-Helper.exe with its icon,
# version information and manifest, and publishes it as a GitHub release.
# Tags with a suffix (v0.1.0-rc.1) become pre-releases, which the website's
# "latest" download link skips.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: helper/go.sum
      - name: Version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}.0" >> "$GITHUB_OUTPUT"
      - run: go vet ./...
      - run: go test ./...
        env:
          DISKATLAS_TEST_RECYCLE: '1'
      - name: Icon, version information and manifest
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 --product-version "${{ steps.v.outputs.numeric }}" --file-version "${{ steps.v.outputs.numeric }}"
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name=DiskAtlas-Helper.exe
            [ "$arch" = arm64 ] && name=DiskAtlas-Helper-arm64.exe
            GOARCH=$arch go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ steps.v.outputs.version }}" -o "dist/$name" .
          done
          (cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Show the version information
        shell: pwsh
        run: (Get-Item dist/DiskAtlas-Helper.exe).VersionInfo | Format-List FileDescription, ProductName, FileVersion, ProductVersion, LegalCopyright, OriginalFilename
      # Code signing would go here (see "Code signing" in
      # docs/launch-checklist.md).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.v.outputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/DiskAtlas-Helper.exe dist/DiskAtlas-Helper-arm64.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "DiskAtlas Helper ${{ steps.v.outputs.version }}" \
            --notes "The small program that lets the DiskAtlas website survey whole drives such as C:\\ and system folders. Download **DiskAtlas-Helper.exe** (or DiskAtlas-Helper-arm64.exe for Windows on ARM) and run it once. On its first run it registers the diskatlas-helper:// link for your Windows user; \`DiskAtlas-Helper.exe --uninstall\` removes it again. It isn't code-signed yet, so Windows SmartScreen may warn: choose \"More info\", then \"Run anyway\". SHA256SUMS.txt lists the checksums." \
            $prerelease
